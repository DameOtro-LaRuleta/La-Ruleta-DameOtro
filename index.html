<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LA RULETA - DameOtro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;600;700;800&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="main-container">
    <header class="header">
      <h1 class="title">LA RULETA</h1>
      <div class="subtitle-container">
        <span class="line"></span>
        <p class="subtitle">8 SABORES PARA REPETIR</p>
        <span class="line"></span>
      </div>
    </header>

    <div class="roulette-wrapper">
      <!-- Etiquetas laterales con los nombres de postres -->
      <div class="labels-container left-labels">
        <div class="flavor-label label-07">
          <span class="script-title">Red Velvet Royale</span>
          <span class="script-sub">Cheesecake</span>
        </div>
        <div class="flavor-label label-06">
          <span class="script-title">Lemon</span>
          <span class="script-sub">Cream Pie</span>
        </div>
        <div class="flavor-label label-05">
          <span class="script-title">Brookie</span>
          <span class="script-sub">Supreme</span>
        </div>
      </div>

      <!-- Contenedor central de Ruleta -->
      <div class="wheel-box">
        <!-- Flecha Dorada Superior/Indicador -->
        <div class="gold-pointer">▲</div>
        
        <div class="wheel-frame">
          <canvas id="wheelCanvas" width="500" height="500"></canvas>
          <button id="spinBtn" class="spin-center-btn">
            <span>GIRAR</span>
          </button>
        </div>
      </div>

      <div class="labels-container right-labels">
        <div class="flavor-label label-08">
          <span class="script-title">Chocolate Fudge</span>
          <span class="script-sub">Brownie</span>
        </div>
        <div class="flavor-label label-01">
          <span class="script-title">Carrot Cake</span>
          <span class="script-sub">Atelier</span>
        </div>
        <div class="flavor-label label-02">
          <span class="script-title">Brownie Cheesecake</span>
          <span class="script-sub">Fusion</span>
        </div>
        <div class="flavor-label label-03">
          <span class="script-title">Apple Crumble</span>
          <span class="script-sub">Delight</span>
        </div>
      </div>
    </div>

    <!-- Etiqueta inferior central -->
    <div class="flavor-label label-04 bottom-label">
      <span class="script-title">Classic New York</span>
      <span class="script-sub">Cheesecake</span>
    </div>

    <!-- Colección de botones -->
    <footer class="footer">
      <p class="collection-title">COLECCIÓN DE SABORES</p>
      <div class="flavor-badges" id="flavorBadges">
        <div class="badge" data-index="0">1</div>
        <div class="badge" data-index="1">2</div>
        <div class="badge" data-index="2">3</div>
        <div class="badge" data-index="3">4</div>
        <div class="badge" data-index="4">5</div>
        <div class="badge" data-index="5">6</div>
        <div class="badge" data-index="6">7</div>
        <div class="badge" data-index="7">8</div>
      </div>
    </footer>
  </div>

  <!-- Modal de Ganador / Resultado -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <h2 id="modalTitle">¡TU SABOR ES!</h2>
      <div id="modalFlavor" class="modal-flavor-name"></div>
      <p id="modalDesc" class="modal-desc"></p>
      <button id="claimBtn" class="claim-btn">¡RECLAMAR PROMO!</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
